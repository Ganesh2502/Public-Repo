<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact — SE Core</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Get a free consultation with SE Core. We reply within 24 hours." />
  <link rel="canonical" href="https://secore.in/contact.html" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body>
  <header class="nav"><div class="container inner">
    <a class="brand" href="/"><span class="dot"></span><img src="/assets/images/logo.svg" alt="SE Core" width="28" height="28" />SE Core</a>
    <nav><a href="/services.html">Services</a></nav>
  </div></header>
  <main class="section container">
    <h1 class="h1">Let’s talk</h1>
    <p class="lead">Tell us your top challenges. We’ll respond within 24 hours.</p>
    <form action="https://formspree.io/f/YOUR_ENDPOINT" method="POST" class="card" style="display:grid;gap:16px;max-width:720px">
      <div class="form-row">
        <div><label for="name">Name</label><input class="input" id="name" name="name" autocomplete="name" required /></div>
        <div><label for="email">Email</label><input class="input" id="email" type="email" name="email" autocomplete="email" required /></div>
      </div>
      <div><label for="msg">Message</label><textarea class="input" id="msg" name="message" rows="6" required></textarea></div>
      <div><button class="btn" type="submit">Send Message</button> <a class="btn outline" href="mailto:hello@secore.in">Email instead</a></div>
      <input type="hidden" name="_subject" value="New inquiry from secore.in" />
      <input type="text" name="_gotcha" style="display:none" />
    </form>
  </main>
  <footer class="footer"><div class="container inner"><small class="lead">© <span id="y"></span> SE Core</small></div></footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
